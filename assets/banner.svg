<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#111115"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 140) rotate(135) scale(420 220)">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 220) rotate(25) scale(360 180)">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveBlue" x1="120" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.05"/>
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="waveEmerald" x1="120" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.05"/>
      <stop offset="45%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="80" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowBlue)"/>
    <rect width="1200" height="320" fill="url(#glowEmerald)"/>

    <line x1="0" y1="200" x2="1200" y2="200" stroke="rgba(255,255,255,0.09)" stroke-width="1.2"/>
    <line x1="680" y1="0" x2="680" y2="320" stroke="rgba(255,255,255,0.09)" stroke-width="1.2"/>

    <path d="M 480 200 C 540 200, 560 92, 640 92 C 720 92, 740 200, 820 200 C 890 200, 920 112, 990 112 C 1045 112, 1085 162, 1140 200 L 1140 200 L 480 200 Z" fill="url(#areaFill)"/>

    <path d="M 60 228 C 160 278, 220 130, 320 138 C 420 146, 460 264, 560 242 C 660 220, 700 84, 800 94 C 900 104, 940 248, 1040 218 C 1100 200, 1140 156, 1185 164" stroke="url(#waveEmerald)" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" fill="none"/>

    <path d="M 40 200 C 120 200, 160 256, 240 256 C 320 256, 360 124, 440 124 C 520 124, 560 232, 640 212 C 720 192, 755 88, 840 92 C 925 96, 955 244, 1040 236 C 1105 230, 1145 165, 1190 154" stroke="url(#waveBlue)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <circle cx="640" cy="212" r="5" fill="#fafafa" stroke="#09090b" stroke-width="2"/>
    <circle cx="840" cy="92" r="5.5" fill="#60a5fa" stroke="#09090b" stroke-width="2"/>
    <circle cx="957" cy="200" r="5" fill="#34d399" stroke="#09090b" stroke-width="2"/>

    <g transform="translate(64, 58)">
      <rect x="0" y="0" width="52" height="52" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1.2"/>
      <path d="M 11 36 C 16 14, 24 14, 27 26 C 30 38, 36 38, 41 16" stroke="#60a5fa" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <circle cx="26" cy="26" r="2.8" fill="#fafafa"/>

      <text x="70" y="34" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.03em">OpenGraph</text>
      <text x="72" y="58" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">High-Precision 2D &amp; 3D Symbolic Graphing Calculator</text>
    </g>

    <g transform="translate(64, 160)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="500">
      <rect x="0" y="0" width="128" height="30" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
      <text x="64" y="19" fill="#e4e4e7" text-anchor="middle">SymPy + NumPy</text>

      <rect x="138" y="0" width="150" height="30" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
      <text x="213" y="19" fill="#e4e4e7" text-anchor="middle">Adaptive Sampling</text>

      <rect x="298" y="0" width="144" height="30" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
      <text x="370" y="19" fill="#e4e4e7" text-anchor="middle">Marching Squares</text>

      <rect x="452" y="0" width="106" height="30" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
      <text x="505" y="19" fill="#e4e4e7" text-anchor="middle">3D Surfaces</text>

      <rect x="568" y="0" width="134" height="30" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
      <text x="635" y="19" fill="#e4e4e7" text-anchor="middle">LaTeX / MathLive</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="22" stroke="rgba(255,255,255,0.14)" fill="none"/>
